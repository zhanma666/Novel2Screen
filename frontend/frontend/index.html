<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scenecraft - 基于大语言模型的小说影视化创作平台，支持小说上传、人物图谱、剧本改编、AI审校、分镜生成和YAML导出" />
    <meta name="keywords" content="小说改编,剧本生成,AI审校,影视创作,分镜脚本,YAML导出" />
    <meta name="author" content="Scenecraft Team" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Scenecraft - 小说影视化创作平台" />
    <meta property="og:description" content="基于大语言模型的小说影视化创作平台前端原型" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#153a35" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <title>Scenecraft - 小说影视化创作平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 欢迎页 -->
    <div class="welcome-page" id="welcomePage">
      <!-- 顶部导航 -->
      <header class="welcome-header">
        <div class="welcome-header-left">
          <div class="welcome-header-logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" rx="12" fill="#1a1a1a"/>
              <path d="M14 34V14h7l5 10 5-10h7v20h-5V22l-5 10-5-10v12h-4z" fill="#f9f6ef"/>
            </svg>
          </div>
          <div class="welcome-header-title">
            <h2>Scenecraft</h2>
            <p>小说 → 结构化剧本 YAML 草稿</p>
          </div>
        </div>
        <div class="welcome-header-right">
          <button class="welcome-header-btn ghost">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            查看 YAML Schema 文档
          </button>
          <button class="welcome-header-btn ghost">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            导出
          </button>
          <button class="welcome-header-btn outline">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 主内容区 -->
      <main class="welcome-main">
        <div class="welcome-tagline">
          <span>⚛️</span>
          支持 3+ 章节自动解析 · 场景 / 人物 / 对白结构化 · YAML 可双向编辑
        </div>

        <h1 class="welcome-title">
          把你的小说，
          <span class="welcome-title-accent">一键拆成剧本</span>
        </h1>

        <p class="welcome-description">
          粘贴章节文本 · 自动识别人物 / 场景 / 时间 · 输出符合 Schema v1 的 <span class="highlight-yaml">YAML</span> 草稿，
          支持 Fountain / JSON 导出，直接进入分镜流程。
        </p>

        <div class="welcome-actions">
          <button class="welcome-btn primary" id="enterBtn" type="button">
            开始创作
          </button>
        </div>
      </main>
    </div>

    <!-- 功能页面 -->
    <div class="app-shell" id="appShell" style="display: none;">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand-block">
          <div class="brand-mark">SC</div>
          <div class="brand-copy">
            <p class="brand-kicker">Frontend Prototype</p>
            <h1>Scenecraft</h1>
            <p>基于大语言模型的小说影视化创作平台前端原型</p>
          </div>
        </div>

        <div class="sidebar-project" id="sidebarProject"></div>
        <nav class="nav-list" id="navList" aria-label="工作区导航"></nav>
      </aside>

      <main class="main-stage">
        <header class="hero" id="hero"></header>
        <section class="section-body" id="sectionBody"></section>
      </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <script defer src="./data.js"></script>
    <script defer src="./yaml.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
